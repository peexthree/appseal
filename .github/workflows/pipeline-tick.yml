name: pipeline tick

# Living-registry heartbeat: hit the production tick endpoint every 30 min.
# The endpoint is rate-locked (one auto scan per 20 min), so stray calls are
# harmless no-ops; when TICK_SECRET is configured on the server (and in the
# repo secrets) the tick presents it via the x-tick-secret header.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: hit the tick endpoint
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -n "$TICK_SECRET" ]; then
            curl -fsS -m 70 -H "x-tick-secret: $TICK_SECRET" https://appseal.online/api/pipeline-tick || true
          else
            curl -fsS -m 70 https://appseal.online/api/pipeline-tick || true
          fi
