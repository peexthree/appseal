name: monitor tick

# Launch Pass background monitor: rescans one watched paid host and alerts
# on degradation. Public endpoint, rate-locked - no secrets needed here.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: hit the monitor endpoint
        run: curl -fsS -m 90 https://appseal.online/api/monitor-tick || true
