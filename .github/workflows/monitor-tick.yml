name: monitor tick

# Launch Pass background monitor: rescans one watched paid host and alerts
# on degradation. Rate-locked; when TICK_SECRET is configured on the server
# (and in the repo secrets) the tick presents it via the x-tick-secret header.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: hit the monitor endpoint
        env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
        run: |
          if [ -n "$TICK_SECRET" ]; then
            curl -fsS -m 90 -H "x-tick-secret: $TICK_SECRET" https://appseal.online/api/monitor-tick || true
          else
            curl -fsS -m 90 https://appseal.online/api/monitor-tick || true
          fi
